server:
  port: 9011

spring:
  application:
    name: auth-flow
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:redis.yml
      - optional:nacos:auth-security.yml
      - optional:nacos:datasource.yml
      - optional:nacos:common-config.yml
      - optional:nacos:resource-server.yml
  # 数据源本地回退配置 (未连接 Nacos 时自动使用)
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-workflow.sql
  cloud:
    nacos:
      discovery:
        server-addr: @nacos.server-addr@
        namespace: @nacos.namespace@
        group: @nacos.group@
        register-enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: @nacos.server-addr@
        namespace: @nacos.namespace@
        group: @nacos.group@
        file-extension: yml
        refresh-enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}


# ======================== Knife4j API文档 ========================
# 安全提示：API 文档会暴露全部接口签名，生产环境必须通过环境变量关闭，
# 否则攻击者可据此枚举接口进行越权探测。dev 默认开启，prod 由部署流水线置为 false。
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
  group-configs:
    - group: '审批流程'
      paths-to-match: /api/workflow/**

knife4j:
  enable: ${API_DOCS_ENABLED:true}
  setting:
    language: zh-CN
    enable-search: true

# 统一日志上报到 log-server
log:
  client:
    enabled: true
    server-url: http://log-server
