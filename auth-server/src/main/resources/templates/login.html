<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统一授权中台 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .login-box {
            width: 400px;
            max-width: 90vw;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 40px 32px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #909399;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #606266;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            font-size: 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64,158,255,0.15);
        }
        .error-msg {
            color: #f56c6c;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            min-height: 20px;
        }
        .login-btn {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #409eff, #337ecc);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 4px;
            transition: opacity 0.2s;
        }
        .login-btn:hover { opacity: 0.9; }
        .login-footer {
            text-align: center;
            color: #c0c4cc;
            font-size: 12px;
            margin-top: 24px;
        }
        .extra-links {
            text-align: center;
            margin-top: 16px;
        }
        .extra-links a {
            color: #409eff;
            font-size: 13px;
            text-decoration: none;
        }
        .extra-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1 class="login-title">统一授权中台</h1>
        <p class="login-subtitle">OAuth2 SSO 单点登录</p>

        <div class="error-msg" th:if="${param.error != null}">
            用户名或密码错误，请重试
        </div>
        <div class="error-msg" th:if="${param.logout != null}">
            您已成功退出登录
        </div>

        <form th:action="@{/auth-server/login}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       placeholder="请输入密码" required>
            </div>
            <!-- Spring Security CSRF -->
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
            <button type="submit" class="login-btn">登 录</button>
        </form>

        <div class="extra-links">
            <a href="/register">没有账号？立即注册</a>
        </div>

        <div class="login-footer">
            Copyright &copy; 2026 Auth Platform · Spring Authorization Server
        </div>
    </div>
</body>
</html>
