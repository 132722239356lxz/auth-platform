# =============================================================================
# auth-platform — GitLab CI/CD 流水线
# =============================================================================
# 触发规则：
#   - 推送到 dev / develop 分支      → 构建 + 扫描 + 自动部署到 DEV 环境
#   - 推送到 main / master 分支      → 构建 + 扫描 + 镜像打 tag（生产部署需手动确认）
#   - 打 v* 标签（如 v1.2.0）        → 部署到 PROD 环境（手动确认）
#   - 其它分支的 Merge Request       → 只做构建与扫描，不部署
#
# 需要在 GitLab「设置 → CI/CD → 变量」中配置以下变量（勾选 Protected / Masked）：
#   DEV_SSH_PRIVATE_KEY    部署机 SSH 私钥（用于 dev 部署）
#   DEV_HOST               dev 部署机地址，如 user@192.168.1.10
#   DEV_DEPLOY_PATH        dev 项目目录，如 /opt/auth-platform
#   PROD_SSH_PRIVATE_KEY   生产机 SSH 私钥
#   PROD_HOST              生产部署机地址
#   PROD_DEPLOY_PATH       生产项目目录，如 /opt/auth-platform
#   NACOS_PASSWORD         Nacos 密码（构建期可选，运行期由目标机器 .env 提供）
#   APP_VERSION            版本号（可在流水线运行时手工指定，默认用 CI_COMMIT_SHORT_SHA）
#
# 镜像仓库使用 GitLab 内置 Container Registry（CI_REGISTRY_* 为内置变量，无需配置）
# =============================================================================

stages:
  - build
  - test
  - security
  - package
  - package-frontend
  - deploy-dev
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dhttps.protocols=TLSv1.2"
  MAVEN_CLI_OPTS: "--batch-mode --errors --show-version -DskipTests"
  # 镜像 tag 策略：打 tag 时用 tag 名，否则用 commit 短 SHA
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_DRIVER: overlay2

# 复用 Maven 依赖缓存，避免每次流水线重新下载全部依赖
.maven_cache: &maven_cache
  key: "$CI_JOB_NAME"
  paths:
    - .m2/repository

# ---------- 阶段 1：编译 ----------
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags: [docker]
  cache: *maven_cache
  script:
    - mvn $MAVEN_CLI_OPTS clean package -Pdev
  artifacts:
    name: "auth-platform-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - gateway/target/*.jar
      - auth-server/target/*.jar
      - system-server/target/*.jar
      - auth-flow/target/*.jar
      - auth-message/target/*.jar
      - ai-agent-server/target/*.jar
      - log-server/target/*.jar
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

# ---------- 阶段 2：单元测试 ----------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags: [docker]
  cache: *maven_cache
  needs: ["build"]
  script:
    - mvn --batch-mode test -Pdev
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  # 测试失败不阻断流水线（项目当前单测覆盖率有限），仅产出报告
  allow_failure: true

# ---------- 阶段 3：安全扫描 ----------

# 3.1 第三方依赖漏洞扫描（OWASP Dependency-Check）
dependency-scan:
  stage: security
  image: maven:3.9-eclipse-temurin-17
  tags: [docker]
  cache: *maven_cache
  needs: []
  script:
    # OWASP Dependency-Check：比对依赖与 NVD 漏洞库，识别含已知 CVE 的第三方组件。
    # 首次运行需下载漏洞库（约数分钟），已在下方缓存以加速后续流水线。
    - mvn --batch-mode org.owasp:dependency-check-maven:check
      -Dformat=HTML -Dformat=JSON
      -DfailOnError=false
      -DsuppressionFile=.dependency-check-suppressions.xml
  cache:
    key: dependency-check-db
    paths:
      - .m2/repository/org/owasp/dependency-check-data
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - target/dependency-check-report.*
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: true

# 3.2 源码敏感信息扫描 —— 拦截硬编码密码/密钥，避免凭证入库
secret-scan:
  stage: security
  image: alpine:3.19
  tags: [docker]
  needs: []
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git grep
  script:
    - sh scripts/security/secret-scan.sh
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

# ---------- 阶段 4：构建并推送 Docker 镜像 ----------
.package_template: &package_template
  stage: package
  image: docker:24-cli
  tags: [docker]
  services:
    - docker:24-dind
  needs: ["build", "secret-scan"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export SERVER_PORT_ARG="$SERVICE_PORT"
    - docker build
      --build-arg JAR_FILE="$SERVICE_NAME/target/$SERVICE_NAME.jar"
      --build-arg SERVER_PORT="$SERVICE_PORT"
      --build-arg APP_PROFILE="$APP_PROFILE"
      --pull
      -t "$CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE/$SERVICE_NAME:latest" .
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE_NAME:latest"

package:dev:
  <<: *package_template
  variables:
    APP_PROFILE: dev
  parallel:
    matrix:
      - SERVICE_NAME: gateway
        SERVICE_PORT: "8080"
      - SERVICE_NAME: auth-server
        SERVICE_PORT: "9000"
      - SERVICE_NAME: system-server
        SERVICE_PORT: "9001"
      - SERVICE_NAME: auth-flow
        SERVICE_PORT: "9011"
      - SERVICE_NAME: auth-message
        SERVICE_PORT: "9002"
      - SERVICE_NAME: ai-agent-server
        SERVICE_PORT: "9003"
      - SERVICE_NAME: log-server
        SERVICE_PORT: "9009"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "develop"'

package:prod:
  <<: *package_template
  variables:
    APP_PROFILE: prod
  parallel:
    matrix:
      - SERVICE_NAME: gateway
        SERVICE_PORT: "8080"
      - SERVICE_NAME: auth-server
        SERVICE_PORT: "9000"
      - SERVICE_NAME: system-server
        SERVICE_PORT: "9001"
      - SERVICE_NAME: auth-flow
        SERVICE_PORT: "9011"
      - SERVICE_NAME: auth-message
        SERVICE_PORT: "9002"
      - SERVICE_NAME: ai-agent-server
        SERVICE_PORT: "9003"
      - SERVICE_NAME: log-server
        SERVICE_PORT: "9009"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

# ---------- 阶段 5：构建前端镜像 ----------
# 前端为纯静态产物，由 Nginx 托管；API 通过容器内 Nginx 反向代理到网关。
# 注意：严禁通过 --build-arg 传入任何密钥，VITE_ 变量会随构建产物公开。
.frontend_template: &frontend_template
  stage: package-frontend
  image: docker:24-cli
  tags: [docker]
  services:
    - docker:24-dind
  needs: ["secret-scan"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd "$FRONTEND_DIR"
    - docker build --pull
      -t "$CI_REGISTRY_IMAGE/$FRONTEND_NAME:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE/$FRONTEND_NAME:latest" .
    - docker push "$CI_REGISTRY_IMAGE/$FRONTEND_NAME:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/$FRONTEND_NAME:latest"

frontend:dev:
  <<: *frontend_template
  parallel:
    matrix:
      - FRONTEND_DIR: frontend-web
        FRONTEND_NAME: frontend-web
      - FRONTEND_DIR: frontend-app
        FRONTEND_NAME: frontend-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "develop"'

frontend:prod:
  <<: *frontend_template
  parallel:
    matrix:
      - FRONTEND_DIR: frontend-web
        FRONTEND_NAME: frontend-web
      - FRONTEND_DIR: frontend-app
        FRONTEND_NAME: frontend-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

# ---------- 阶段 6：部署到 DEV 环境（自动） ----------

deploy:dev:
  stage: deploy-dev
  image: alpine:3.19
  tags: [docker]
  needs: ["package:dev", "frontend:dev"]
  environment:
    name: dev
    url: http://$DEV_HOSTNAME
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "${DEV_HOST#*@}" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$DEV_HOST" << EOF
        set -e
        cd $DEV_DEPLOY_PATH
        echo "== 拉取 $IMAGE_TAG 版本镜像 =="
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        export APP_VERSION=$IMAGE_TAG
        export IMAGE_REGISTRY=$CI_REGISTRY_IMAGE
        docker compose -f docker-compose.dev.yml pull
        echo "== 滚动重启服务 =="
        docker compose -f docker-compose.dev.yml up -d --remove-orphans
        echo "== 清理悬空镜像 =="
        docker image prune -f
        echo "✅ DEV 部署完成: $IMAGE_TAG"
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "develop"'

# ---------- 阶段 7：部署到 PROD 环境（手动确认） ----------
deploy:prod:
  stage: deploy-prod
  image: alpine:3.19
  tags: [docker]
  needs: ["package:prod", "frontend:prod"]
  environment:
    name: prod
    url: https://$PROD_HOSTNAME
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "${PROD_HOST#*@}" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$PROD_HOST" << EOF
        set -e
        cd $PROD_DEPLOY_PATH
        echo "== 备份当前版本配置以便回滚 =="
        cp .env .env.bak.\$(date +%Y%m%d%H%M%S) 2>/dev/null || true
        echo "== 拉取 $IMAGE_TAG 版本镜像 =="
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        export APP_VERSION=$IMAGE_TAG
        export IMAGE_REGISTRY=$CI_REGISTRY_IMAGE
        docker compose -f docker-compose.prod.yml pull
        echo "== 滚动重启服务 =="
        docker compose -f docker-compose.prod.yml up -d --remove-orphans
        echo "== 等待健康检查 =="
        sleep 45
        docker compose -f docker-compose.prod.yml ps
        echo "✅ PROD 部署完成: $IMAGE_TAG"
      EOF
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
  allow_failure: false
