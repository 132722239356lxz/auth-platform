# =============================================================================
# 移动端 H5 Nginx 配置
# =============================================================================
# 与 Web 管理端配置基本一致，差异：
#   - 移动端在 iframe / 第三方容器中打开的场景更多，CSP 放宽 frame-ancestors
#   - 移动端可能嵌入企业微信等容器，需允许部分内联样式与脚本
# =============================================================================

resolver 127.0.0.11 valid=30s ipv6=off;

upstream api_gateway {
    server gateway:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    client_max_body_size 20m;

    # ---------------- 安全响应头 ----------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 移动端允许被同域或企业应用容器嵌入；UniApp 运行时依赖内联脚本与样式
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;

    # ---------------- 健康检查 ----------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---------------- 静态资源 ----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ---------------- 反向代理：各微服务前缀 ----------------
    location ~ ^/(auth-server|system-server|auth-flow|auth-message|ai-agent-server|log-server)/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    # ---------------- WebSocket 代理 ----------------
    location ~ ^/(auth-message|ai-agent-server)/.*(ws|websocket|stream) {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------- H5 路由回退 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
