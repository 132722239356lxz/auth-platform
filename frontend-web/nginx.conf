# =============================================================================
# 管理端 Web 前端 Nginx 配置
# =============================================================================
# 职责：
#   1. 托管 Vue SPA 静态资源，并做 history 路由回退
#   2. 将各微服务前缀反向代理到网关（容器内服务名 gateway:8080）
#   3. 加固：安全响应头、隐藏版本号、限制请求体大小
# =============================================================================

# 使用 Docker 内嵌 DNS，支持后端容器重启后重新解析（避免 nginx 因启动期解析失败而退出）
resolver 127.0.0.11 valid=30s ipv6=off;

upstream api_gateway {
    server gateway:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 隐藏 Nginx 版本号，减少信息泄露
    server_tokens off;

    # 上传大小限制（按需调整）
    client_max_body_size 20m;

    # ---------------- 安全响应头 ----------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 管理端无需被第三方嵌入，且不涉及跨域资源，限制为同源
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self';" always;

    # ---------------- 压缩 ----------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/vnd.ms-fontobject font/ttf
               font/opentype image/svg+xml;

    # ---------------- 健康检查 ----------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---------------- 静态资源（带指纹，长期缓存） ----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ---------------- 反向代理：各微服务前缀 ----------------
    # 前端以相对路径请求（如 /system-server/api/users），由网关统一路由与鉴权。
    # 使用 X-Forwarded-* 头传递真实协议与主机，便于后端生成正确的回调地址。
    location ~ ^/(auth-server|system-server|auth-flow|auth-message|ai-agent-server|log-server)/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 失败时切换下一台后端（此处为单实例，主要应对容器重启瞬断）
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # 关闭缓冲，避免大响应（如文件下载、AI 流式输出）阻塞
        proxy_buffering off;
    }

    # ---------------- WebSocket 代理（站内信实时推送） ----------------
    location ~ ^/(auth-message|ai-agent-server)/.*(ws|websocket|stream) {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------- SPA history 路由回退 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------- 错误页 ----------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
